<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Smart Ration Dispenser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Government Header -->
    <header class="gov-header">

        <img src="banner.png" alt="Government of Tamil Nadu">

    </header>


    <!-- Logout Button -->
    <button id="logoutButton" class="logout-button">
        LOGOUT
    </button>


    <!-- Main Section -->
    <main class="main-section">

        <!-- Project Title -->
        <div class="project-title">

            <h1>SMART RATION</h1>

            <h2>DISPENSER SYSTEM</h2>

        </div>


        <!-- Payment Card -->
        <div class="payment-card">

            <div class="payment-header">

                <h2>Payment</h2>

                <p>Complete your ration purchase</p>

            </div>


            <!-- Bill Summary -->
            <div class="bill-section">

                <h3>Bill Summary</h3>

                <div id="billItems"></div>

                <div class="bill-total">

                    <span>Total Amount</span>

                    <strong id="paymentTotal">
                        ₹0
                    </strong>

                </div>

            </div>


            <!-- QR Payment -->
            <div class="qr-section">

                <h3>Scan & Pay</h3>

                <p>Scan the QR code using any UPI app</p>

                <div class="qr-box">

                    <!-- Dummy QR -->
                    <img
                        src="qr.png"
                        alt="UPI QR Code"
                    >

                </div>

                <p class="upi-text">
                    UPI ID: <b>smartration@upi</b>
                </p>

            </div>


            <!-- Payment Button -->
            <button
                id="confirmPaymentButton"
                class="payment-confirm-button"
            >
                PAYMENT COMPLETED
            </button>


            <p id="paymentMessage"></p>


            <!-- Success -->
            <div
                id="paymentSuccess"
                class="payment-success"
            >

                <div class="success-icon">✓</div>

                <h3>Payment Successful!</h3>

                <p>
                    Your ration order has been confirmed.
                </p>

                <button
                    id="finishButton"
                    class="finish-button"
                >
                    FINISH
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
