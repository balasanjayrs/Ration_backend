<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Ration - Commodities</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Government Header -->
    <header class="gov-header">

        <img src="banner.png" alt="Government of Tamil Nadu">

    </header>


    <!-- Logout Button -->
    <button id="logoutButton" class="logout-button">
        LOGOUT
    </button>


    <!-- Main Section -->
    <main class="main-section">

        <!-- Project Name -->
        <div class="project-title">

            <h1>SMART RATION</h1>

            <h2>DISPENSER SYSTEM</h2>

        </div>


        <!-- Commodity Card -->
        <div class="commodity-card">

            <div class="commodity-header">

                <h2>Select Commodities</h2>

                <p>
                    Choose the required commodities and quantity
                </p>

            </div>


            <!-- User Information -->
            <div class="user-info">

                <div>
                    <span>Name</span>
                    <strong>K. Kumar</strong>
                </div>

                <div>
                    <span>Smart Card No.</span>
                    <strong>1234 5678 9012</strong>
                </div>

            </div>


            <!-- Commodity List -->

            <div class="commodity-list">


                <!-- Rice -->
                <div class="commodity-item">

                    <div class="commodity-info">

                        <h3>Rice</h3>

                        <p>
                            ₹2 / kg
                        </p>

                    </div>

                    <div class="quantity-control">

                        <button
                            type="button"
                            class="minus"
                            data-item="rice"
                        >
                            −
                        </button>

                        <span
                            id="riceQuantity"
                        >
                            0
                        </span>

                        <button
                            type="button"
                            class="plus"
                            data-item="rice"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- Wheat -->
                <div class="commodity-item">

                    <div class="commodity-info">

                        <h3>Wheat</h3>

                        <p>
                            ₹3 / kg
                        </p>

                    </div>

                    <div class="quantity-control">

                        <button
                            type="button"
                            class="minus"
                            data-item="wheat"
                        >
                            −
                        </button>

                        <span
                            id="wheatQuantity"
                        >
                            0
                        </span>

                        <button
                            type="button"
                            class="plus"
                            data-item="wheat"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- Sugar -->
                <div class="commodity-item">

                    <div class="commodity-info">

                        <h3>Sugar</h3>

                        <p>
                            ₹25 / kg
                        </p>

                    </div>

                    <div class="quantity-control">

                        <button
                            type="button"
                            class="minus"
                            data-item="sugar"
                        >
                            −
                        </button>

                        <span
                            id="sugarQuantity"
                        >
                            0
                        </span>

                        <button
                            type="button"
                            class="plus"
                            data-item="sugar"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- Dal -->
                <div class="commodity-item">

                    <div class="commodity-info">

                        <h3>Dal</h3>

                        <p>
                            ₹20 / kg
                        </p>

                    </div>

                    <div class="quantity-control">

                        <button
                            type="button"
                            class="minus"
                            data-item="dal"
                        >
                            −
                        </button>

                        <span
                            id="dalQuantity"
                        >
                            0
                        </span>

                        <button
                            type="button"
                            class="plus"
                            data-item="dal"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- Oil -->
                <div class="commodity-item">

                    <div class="commodity-info">

                        <h3>Cooking Oil</h3>

                        <p>
                            ₹50 / litre
                        </p>

                    </div>

                    <div class="quantity-control">

                        <button
                            type="button"
                            class="minus"
                            data-item="oil"
                        >
                            −
                        </button>

                        <span
                            id="oilQuantity"
                        >
                            0
                        </span>

                        <button
                            type="button"
                            class="plus"
                            data-item="oil"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>


            <!-- Total -->
            <div class="total-section">

                <span>Total Amount</span>

                <strong id="totalAmount">
                    ₹0
                </strong>

            </div>


            <!-- Next Button -->
            <button
                type="button"
                id="paymentButton"
                class="payment-button"
            >
                PROCEED TO PAYMENT
            </button>


            <p
                id="commodityError"
                class="commodity-error"
            ></p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
